name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fixture pipeline (dbt build, benchmark through the semantic layer, dashboard check, MCP and agent tests)
        run: make fixture-all
      - name: Benchmark summary
        if: always()
        run: cat results/eval_reference.md results/dashboard_check.md >> "$GITHUB_STEP_SUMMARY" || true

# Synthetic fixture for CI. Same table and column names as the real-data load.
# pk / fk / cast describe the tables for staging and tests; the generator ignores them.
seed: 1212
tables:
  - name: customers
    rows: 500
    pk: customer_id
    columns:
      customer_id: {type: id, prefix: C}
      region: {type: choice, values: [UK, Ireland, Portugal, Canada]}
  - name: orders
    rows: 5000
    pk: order_id
    fk: {customer_id: customers.customer_id}
    cast: {order_date: date}
    columns:
      order_id: {type: id, prefix: O}
      customer_id: {type: fk, table: customers, column: customer_id}
      order_date: {type: date, start: 2025-01-01, end: 2025-06-30}
      status: {type: choice, values: [completed, refunded], p: [0.95, 0.05]}
      amount_usd: {type: float, dist: lognormal, mean: 3.8, sigma: 0.6}
